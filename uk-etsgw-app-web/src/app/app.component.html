<govuk-skip-link />

<header>
  <govuk-header>
    @if (isLoggedIn()) {
      <button type="button" class="link-button govuk-link--inverse" (click)="authService.logout()">Sign out</button>
    }
  </govuk-header>
  <govuk-service-navigation serviceName="Manage your UK ETS reporting" [serviceHomepage]="{ routerLink: '/' }" />
</header>

<div class="govuk-width-container">
  @if (appService.showHomeBreadcrumb()) {
    <govuk-breadcrumbs>
      <a govukLink="breadcrumb" routerLink="../">Home</a>
    </govuk-breadcrumbs>
  }
  <main class="govuk-main-wrapper" id="main-content" role="main">
    <router-outlet />
  </main>
  <etsgw-phase-bar />
</div>

<footer>
  <govuk-footer [meta]="footerMetaLinks" />
</footer>

<etsgw-timeout-banner />
